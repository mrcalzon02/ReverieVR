# The owner's original authored software is MIT. Imported upstream code is
# deliberately not covered by these globs; it keeps its own grant and notices.
[[annotations]]
path = ["app/src/main/java/io/github/mrcalzon02/reverievr/**", "controller-app/src/main/java/**", "app/src/main/jni/native/**", "app/src/main/jni/reverie_dos_host.cpp", "app/src/test/**", "controller-app/src/test/**", "cardboard-adapter/src/main/**", "scripts/**", "tools/steam_controller/*.py", "tools/steam_controller/*.mjs", "diagnostic-intake/src/**", "diagnostic-intake/test/**", "app/build.gradle", "controller-app/build.gradle", "cardboard-adapter/build.gradle", "build.gradle", "settings.gradle", ".github/workflows/**", "gradlew", "gradlew.bat"]
