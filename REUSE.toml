SPDX-FileCopyrightText = "2026 ReverieVR contributors"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["app/src/main/res/**/*.xml", "controller-app/src/main/res/**/*.xml", "cardboard-adapter/src/main/res/**/*.xml", "app/src/main/AndroidManifest.xml", "controller-app/src/main/AndroidManifest.xml"]
