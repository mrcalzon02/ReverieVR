[[annotations]]
path = ["music/source/audio/*.mp3"]
precedence = "override"
SPDX-FileCopyrightText = "2026 ReverieVR music owner"
SPDX-License-Identifier = "LicenseRef-Owner-Original-Music"

# Metadata/documents are project-authored; these do not relicense MP3s.
[[annotations]]
path = ["music/source/*.md", "music/source/*.json"]
precedence = "override"
SPDX-FileCopyrightText = "2026 ReverieVR contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# Authored offline catalog is a first-party metadata work, NOT a license
