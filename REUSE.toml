SPDX-FileCopyrightText = "2026 ReverieVR contributors"
SPDX-License-Identifier = "MIT"

# Original project prose/documentation, distinct from any quoted or separately
# licensed third-party excerpts, is licensed CC BY 4.0.
[[annotations]]
path = ["README.md", "BUILDING.md", "CHANGELOG.md", "AGENTS.md", "docs/project/**", "docs/native/**", "docs/records/**", "docs/dependencies/**", "docs/licensing/**", "scripts/README-*.md"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 ReverieVR contributors"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = ["third_party/openktg/src/**"]
precedence = "override"
SPDX-FileCopyrightText = "2007 Fabian Giesen"
SPDX-License-Identifier = "LicenseRef-OpenKTG-Public-Domain"

# The following binaries are NOT designated as CC BY or MIT automatically.
# They have separate adjacent .license metadata and unresolved rights reviews.

# Android aapt2 rejects .license sidecars in res/raw or drawable resource
# folders. REUSE annotations supply the same per-file metadata externally.
[[annotations]]
path = ["app/src/main/res/drawable-nodpi/reverievr_logo.jpg", "app/src/main/res/mipmap-nodpi/ic_launcher.jpg", "controller-app/src/main/res/mipmap-nodpi/ic_launcher.jpg", "docs/assets/reverievr-logo.jpg"]
precedence = "override"
SPDX-FileCopyrightText = "NOASSERTION"
SPDX-License-Identifier = "LicenseRef-Pending-Asset-Rights"

