# Suno audio track. Commercial rights do not imply a CC BY/CC0 grant or
# automatic copyright protection; never relicense this as original CC art.
[[annotations]]
path = ["app/src/main/res/raw/starry_cereal_menu.mp3"]
precedence = "override"
SPDX-FileCopyrightText = "NOASSERTION"
SPDX-License-Identifier = "LicenseRef-Suno-Commercial-Use"

[[annotations]]
path = ["app/src/main/assets/models/daydream/vr_controller_daydream.obj", "app/src/main/assets/models/daydream/vr_controller_daydream.mtl"]
