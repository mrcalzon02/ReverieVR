name: Build signed NUTBUSTER using existing ReverieVR signing secrets
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/nutbuster-signer.yml]
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: write
concurrency:
  group: reverievr-nutbuster-signing
  cancel-in-progress: false
jobs:
  sign-nutbuster:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_CERT: 464dc2d100c3bb14deac1da680d29418cc22e60e1857852cb54541f7d7787f7c
    steps:
      - name: Lock NUTBUSTER source to one commit
        id: source
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git ls-remote https://github.com/mrcalzon02/NUTBUSTER-R.git refs/heads/main | awk '{print $1}')"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          TAG="nutbuster-signer-$SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo mrcalzon02/ReverieVR >/dev/null 2>&1; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.source.outputs.skip == 'false'
        with:
          repository: mrcalzon02/NUTBUSTER-R
          ref: ${{ steps.source.outputs.sha }}
          path: nutbuster
          persist-credentials: false
      - uses: actions/setup-java@v4
        if: steps.source.outputs.skip == 'false'
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.source.outputs.skip == 'false'
        with:
          gradle-version: '9.6.1'
      - name: Load original publisher key and verify exact ReverieVR certificate
        if: steps.source.outputs.skip == 'false'
        id: identity
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.PHONE_TEST_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PHONE_TEST_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PHONE_TEST_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PHONE_TEST_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for n in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "$(printenv "$n")" ]]; then echo "::error::Existing ReverieVR secret $n is missing"; exit 1; fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/reverie-publisher.keystore"
          chmod 600 "$RUNNER_TEMP/reverie-publisher.keystore"
          keytool -exportcert -keystore "$RUNNER_TEMP/reverie-publisher.keystore" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" -file "$RUNNER_TEMP/reverie-publisher.der" >/dev/null
          CERT="$(sha256sum "$RUNNER_TEMP/reverie-publisher.der" | cut -d' ' -f1)"
          [[ "$CERT" = "$EXPECTED_CERT" ]] || { echo '::error::Publisher certificate mismatch'; exit 1; }
          echo "path=$RUNNER_TEMP/reverie-publisher.keystore" >> "$GITHUB_OUTPUT"
      - name: Build and verify signed NUTBUSTER APK
        if: steps.source.outputs.skip == 'false'
        shell: bash
        env:
          ORG_GRADLE_PROJECT_phoneTestKeystorePath: ${{ steps.identity.outputs.path }}
          ORG_GRADLE_PROJECT_phoneTestStorePassword: ${{ secrets.PHONE_TEST_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_phoneTestKeyAlias: ${{ secrets.PHONE_TEST_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_phoneTestKeyPassword: ${{ secrets.PHONE_TEST_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          MANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$MANAGER" ]]; then MANAGER="$(command -v sdkmanager)"; fi
          "$MANAGER" 'platforms;android-36' 'build-tools;36.0.0'
          EPOCH="$(date -u +%s)"
          CODE=$(( EPOCH - 1577836800 ))
          gradle -p nutbuster/android --no-daemon -PnutbusterBuildEpochSeconds="$EPOCH" -PnutbusterSignerSha256="$EXPECTED_CERT" :app:assembleRelease
          APK=nutbuster/android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          SDK="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          "$SDK/apksigner" verify --print-certs "$APK" | grep -Fi "Signer #1 certificate SHA-256 digest: $EXPECTED_CERT"
          "$SDK/aapt" dump badging "$APK" | grep -F "package: name='io.github.mrcalzon02.nutbuster' versionCode='$CODE'"
          unzip -Z -1 "$APK" | grep -Fx assets/art/maps/chapter-5-moonlit-golden-palace.webp
          unzip -Z -1 "$APK" | grep -Fx assets/audio/grunt-1.mp3
          mkdir -p handoff
          cp "$APK" handoff/NUTBUSTER-Android-phone-test.apk
          printf 'Source SHA: %s\nVersion code: %s\nCertificate SHA-256: %s\n' '${{ steps.source.outputs.sha }}' "$CODE" "$EXPECTED_CERT" > handoff/BUILD-EVIDENCE.txt
          (cd handoff && sha256sum NUTBUSTER-Android-phone-test.apk BUILD-EVIDENCE.txt > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
      - name: Publish verified pre-release artifact for NUTBUSTER CI handoff
        if: steps.source.outputs.skip == 'false'
        shell: bash
        env:
          TAG: ${{ steps.source.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" --repo mrcalzon02/ReverieVR --target "$GITHUB_SHA" --prerelease --title "NUTBUSTER signing handoff" --notes 'NUTBUSTER APK signed with the EXISTING ReverieVR certificate. Signing handoff only, not a ReverieVR game release.'
          gh release upload "$TAG" handoff/NUTBUSTER-Android-phone-test.apk handoff/BUILD-EVIDENCE.txt handoff/SHA256SUMS.txt --repo mrcalzon02/ReverieVR
          gh api "repos/mrcalzon02/ReverieVR/releases/tags/$TAG" > "$RUNNER_TEMP/handoff.json"
          python3 - <<'PY'
          import hashlib,json,pathlib,os
          j=json.load(open(os.environ['RUNNER_TEMP']+'/handoff.json'))
          assets={a['name']:a for a in j['assets']}
          for p in pathlib.Path('handoff').iterdir():
              a=assets.get(p.name)
              if not a or a.get('size')!=p.stat().st_size or a.get('digest')!='sha256:'+hashlib.sha256(p.read_bytes()).hexdigest():
                  raise SystemExit('Remote signed handoff failed digest readback: '+p.name)
          print('Verified signer handoff assets')
          PY
          gh release edit "$TAG" --repo mrcalzon02/ReverieVR --draft=false --prerelease
