name: Build phone test release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/phone-test-release.yml
      - .github/phone-test-trigger

permissions:
  contents: write

concurrency:
  group: reverievr-phone-test-release
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then SDKMANAGER="$(command -v sdkmanager || true)"; fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Fetch pinned third-party build inputs
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew scripts/fetch-dosbox-pure.sh scripts/fetch-doom-shareware.sh scripts/verify-build-bootstrap.sh
          ./scripts/fetch-dosbox-pure.sh
          ./scripts/fetch-doom-shareware.sh
          ./scripts/verify-build-bootstrap.sh

      - name: Validate diagnostic intake source
        shell: bash
        run: |
          set -euo pipefail
          node --check diagnostic-intake/src/index.js
          node diagnostic-intake/test/worker-validation-smoke.cjs

      - name: Validate Red Ledger native simulation
        shell: bash
        run: |
          set -euo pipefail
          c++ \
            -std=c++17 \
            -Wall -Wextra -Wpedantic -Werror \
            -I app/src/main/jni/native \
            app/src/main/jni/native/red_ledger_simulation.cpp \
            app/src/test/native/red_ledger_simulation_test.cpp \
            -o /tmp/red-ledger-simulation-test
          /tmp/red-ledger-simulation-test

      - name: Validate Ministry and Forward Detachment native simulations
        shell: bash
        run: |
          set -euo pipefail
          for game in lantern_desk forward_detachment; do
            c++ -std=c++17 -Wall -Wextra -Wpedantic -Werror \
              -I app/src/main/jni/native \
              "app/src/main/jni/native/${game}_simulation.cpp" \
              "app/src/test/native/${game}_simulation_test.cpp" \
              -o "/tmp/${game}_simulation_test"
            "/tmp/${game}_simulation_test"
          done

      - name: Validate Breakwater landing and upgrade simulation
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++17 -Wall -Wextra -Wpedantic -Werror \
            -I app/src/main/jni/native \
            app/src/main/jni/native/breakwater_campaign.cpp \
            app/src/test/native/breakwater_campaign_test.cpp \
            -o /tmp/breakwater-campaign-test
          /tmp/breakwater-campaign-test

      - name: Validate deterministic procedural atlas
        shell: bash
        run: |
          set -euo pipefail
          c++ \
            -std=c++17 \
            -Wall -Wextra -Wpedantic -Werror \
            -I app/src/main/jni/native \
            app/src/main/jni/native/procedural_material_atlas.cpp \
            app/src/test/native/procedural_material_atlas_test.cpp \
            -o /tmp/reverie-procedural-material-test
          /tmp/reverie-procedural-material-test

      - name: Validate immutable Red Ledger room batch
        shell: bash
        run: |
          set -euo pipefail
          c++ \
            -std=c++17 \
            -Wall -Wextra -Wpedantic -Werror \
            -I app/src/main/jni/native \
            app/src/main/jni/native/red_ledger_static_geometry.cpp \
            app/src/test/native/red_ledger_static_geometry_test.cpp \
            -o /tmp/red-ledger-static-room-test
          /tmp/red-ledger-static-room-test

      - name: Validate unsigned development tree
        shell: bash
        env:
          DIAGNOSTIC_INTAKE_URL: ${{ vars.DIAGNOSTIC_INTAKE_URL }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon \
            -PdiagnosticIntakeUrl="$DIAGNOSTIC_INTAKE_URL" \
            test :app:assembleDebug :controller-app:assembleDebug

      - name: Prepare persistent phone-test signing
        id: signing
        shell: bash
        env:
          PHONE_TEST_KEYSTORE_BASE64: ${{ secrets.PHONE_TEST_KEYSTORE_BASE64 }}
          PHONE_TEST_STORE_PASSWORD: ${{ secrets.PHONE_TEST_STORE_PASSWORD }}
          PHONE_TEST_KEY_ALIAS: ${{ secrets.PHONE_TEST_KEY_ALIAS }}
          PHONE_TEST_KEY_PASSWORD: ${{ secrets.PHONE_TEST_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "$PHONE_TEST_KEYSTORE_BASE64" \
            || -z "$PHONE_TEST_STORE_PASSWORD" ]]; then
            echo "Persistent phone-test signing is mandatory for published APKs." >&2
            echo "Set PHONE_TEST_KEYSTORE_BASE64 and PHONE_TEST_STORE_PASSWORD." >&2
            exit 1
          fi

          KEYSTORE="$RUNNER_TEMP/reverievr-phone-test.keystore"
          CERT_DER="$RUNNER_TEMP/reverievr-phone-test-cert.der"

          printf '%s' "$PHONE_TEST_KEYSTORE_BASE64" \
            | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          chmod 600 "$KEYSTORE"

          KEY_ALIAS="$(keytool -list -v \
            -keystore "$KEYSTORE" \
            -storepass "$PHONE_TEST_STORE_PASSWORD" \
            | sed -n 's/^Alias name: //p' \
            | head -n 1)"
          test -n "$KEY_ALIAS"

          keytool -list \
            -keystore "$KEYSTORE" \
            -storepass "$PHONE_TEST_STORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            >/dev/null

          keytool -exportcert \
            -keystore "$KEYSTORE" \
            -storepass "$PHONE_TEST_STORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -file "$CERT_DER" \
            >/dev/null

          SIGNER_SHA="$(sha256sum "$CERT_DER" | awk '{print $1}')"
          [[ "$SIGNER_SHA" =~ ^[0-9a-f]{64}$ ]]

          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "keystore_path=$KEYSTORE" >> "$GITHUB_OUTPUT"
          echo "key_alias=$KEY_ALIAS" >> "$GITHUB_OUTPUT"
          echo "signer_sha=$SIGNER_SHA" >> "$GITHUB_OUTPUT"

          echo "Persistent signing identity loaded."
          echo "Distribution certificate SHA-256: $SIGNER_SHA"

      - name: Build persistent phone-test packages
        shell: bash
        env:
          DIAGNOSTIC_INTAKE_URL: ${{ vars.DIAGNOSTIC_INTAKE_URL }}
          ORG_GRADLE_PROJECT_phoneTestKeystorePath: ${{ steps.signing.outputs.keystore_path }}
          ORG_GRADLE_PROJECT_phoneTestStorePassword: ${{ secrets.PHONE_TEST_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_phoneTestKeyAlias: ${{ steps.signing.outputs.key_alias }}
          ORG_GRADLE_PROJECT_phoneTestKeyPassword: ${{ secrets.PHONE_TEST_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon \
            -PdiagnosticIntakeUrl="$DIAGNOSTIC_INTAKE_URL" \
            -PphoneTestRunNumber="$GITHUB_RUN_NUMBER" \
            -PphoneTestRunAttempt="$GITHUB_RUN_ATTEMPT" \
            -PphoneTestSignerSha256="${{ steps.signing.outputs.signer_sha }}" \
            -PsourceRevision="$GITHUB_SHA" \
            :app:assemblePhoneTest :controller-app:assemblePhoneTest

      - name: Verify APK
        id: verify
        shell: bash
        run: |
          set -euo pipefail

          APK=app/build/outputs/apk/phoneTest/app-phoneTest.apk
          CONTROLLER_APK=controller-app/build/outputs/apk/phoneTest/controller-app-phoneTest.apk
          EXPECTED_SIGNER="${{ steps.signing.outputs.signer_sha }}"
          EXPECTED_VERSION_CODE=$((GITHUB_RUN_NUMBER * 1000 + GITHUB_RUN_ATTEMPT))

          test -f "$APK"
          test -f "$CONTROLLER_APK"

          unzip -l "$APK" | grep -F "lib/armeabi-v7a/libreverie_native_host.so"
          unzip -l "$APK" | grep -F "lib/arm64-v8a/libreverie_native_host.so"
          unzip -l "$APK" | grep -F "lib/armeabi-v7a/libreverie_module_test_chamber.so"
          unzip -l "$APK" | grep -F "lib/arm64-v8a/libreverie_module_test_chamber.so"
          unzip -l "$APK" | grep -F "lib/armeabi-v7a/libreverie_module_red_ledger.so"
          unzip -l "$APK" | grep -F "lib/arm64-v8a/libreverie_module_red_ledger.so"
          unzip -l "$APK" | grep -F "lib/armeabi-v7a/libreverie_dos_host.so"
          unzip -l "$APK" | grep -F "lib/arm64-v8a/libreverie_dos_host.so"
          unzip -l "$APK" | grep -F "lib/armeabi-v7a/libcardboard_sdk_jni.so"
          unzip -l "$APK" | grep -F "lib/arm64-v8a/libcardboard_sdk_jni.so"
          unzip -l "$APK" | grep -F "lib/armeabi-v7a/libGfxPluginCardboard.so"
          unzip -l "$APK" | grep -F "lib/arm64-v8a/libGfxPluginCardboard.so"

          # The Daydream controller visual is a runtime asset, not merely a
          # source-tree reference. Refuse publication if packaging drops it.
          unzip -l "$APK" \
            | grep -F "assets/models/daydream/vr_controller_daydream.obj"
          unzip -p "$APK" \
            "assets/models/daydream/vr_controller_daydream.obj" \
            | grep -Fq "o Body_Body_Cylinder"

          # Compilation against Cardboard is not sufficient: a minified
          # library AAR can still strip CardboardView before final packaging.
          # Verify the actual installable APK contains the runtime class.
          unzip -p "$APK" 'classes*.dex' \
            | strings \
            | grep -Fq 'Lcom/google/cardboard/sdk/CardboardView;'

          APKSIGNER="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}/build-tools/36.0.0/apksigner"
          AAPT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}/build-tools/36.0.0/aapt"

          VERIFY_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK")"
          printf '%s\n' "$VERIFY_OUTPUT"
          SIGNER_SHA="$(printf '%s\n' "$VERIFY_OUTPUT" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
            | head -n 1 \
            | tr '[:upper:]' '[:lower:]')"
          [[ "$SIGNER_SHA" =~ ^[0-9a-f]{64}$ ]]
          test "$SIGNER_SHA" = "$EXPECTED_SIGNER"

          CONTROLLER_VERIFY="$("$APKSIGNER" verify --verbose --print-certs "$CONTROLLER_APK")"
          CONTROLLER_SIGNER_SHA="$(printf '%s\n' "$CONTROLLER_VERIFY" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
            | head -n 1 \
            | tr '[:upper:]' '[:lower:]')"
          test "$CONTROLLER_SIGNER_SHA" = "$EXPECTED_SIGNER"

          BADGING="$("$AAPT" dump badging "$APK")"
          VERSION_CODE="$(printf '%s\n' "$BADGING" \
            | sed -n "s/.*versionCode='\([0-9][0-9]*\)'.*/\1/p" \
            | head -n 1)"
          test "$VERSION_CODE" = "$EXPECTED_VERSION_CODE"

          echo "signer_sha=$SIGNER_SHA" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Stage release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:7}"
          TAG="phone-test-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          HEADSET="ReverieVR-phone-test-${GITHUB_RUN_NUMBER}-${SHORT_SHA}.apk"
          CONTROLLER="ReverieVR-Controller-phone-test-${GITHUB_RUN_NUMBER}-${SHORT_SHA}.apk"
          mkdir -p release
          cp app/build/outputs/apk/phoneTest/app-phoneTest.apk "release/$HEADSET"
          cp controller-app/build/outputs/apk/phoneTest/controller-app-phoneTest.apk "release/$CONTROLLER"
          (cd release && sha256sum "$HEADSET" "$CONTROLLER" > SHA256SUMS.txt)
          {
            echo "ReverieVR development phone-test build."
            echo
            echo "Commit: $GITHUB_SHA"
            echo "Run: $GITHUB_RUN_NUMBER attempt $GITHUB_RUN_ATTEMPT"
            echo "Android versionCode: ${{ steps.verify.outputs.version_code }}"
            echo "APK signer SHA-256: ${{ steps.verify.outputs.signer_sha }}"
            echo
            echo "Persistent phone-test signing: enabled."
            echo "In-app update channel: enabled."
            echo "Build type: phoneTest (non-debuggable)."
            echo "This is the permanent ReverieVR direct-distribution signing lineage."
            echo "Includes the native Procedural Test Chamber, hidden Red Ledger foundation module, DOSBox Pure, verified DOOM Shareware sample, and packaged Daydream controller visual."
          } > release/RELEASE-NOTES.md
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "headset=$HEADSET" >> "$GITHUB_OUTPUT"
          echo "controller=$CONTROLLER" >> "$GITHUB_OUTPUT"

      - name: Preserve phone-test package
        uses: actions/upload-artifact@v4
        with:
          name: reverievr-phone-test-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            release/${{ steps.release.outputs.headset }}
            release/${{ steps.release.outputs.controller }}
            release/SHA256SUMS.txt
            release/RELEASE-NOTES.md
          if-no-files-found: error
          retention-days: 14

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.release.outputs.tag }}"
          HEADSET="release/${{ steps.release.outputs.headset }}"
          CONTROLLER="release/${{ steps.release.outputs.controller }}"
          CHECKSUMS="release/SHA256SUMS.txt"

          # GitHub release creation can return transient 5xx after the APKs
          # have already built and passed signing verification. Never claim
          # publication without reading the tag and all expected assets back.
          verify_release() {
            local payload
            payload="$(gh release view "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json tagName,targetCommitish,assets 2>/dev/null)" || return 1
            jq -e \
              --arg tag "$TAG" \
              --arg sha "$GITHUB_SHA" \
              --arg headset "${{ steps.release.outputs.headset }}" \
              --arg controller "${{ steps.release.outputs.controller }}" \
              '.tagName == $tag
                and .targetCommitish == $sha
                and ([.assets[]
                  | select((.name == $headset
                      or .name == $controller
                      or .name == "SHA256SUMS.txt")
                    and .size > 0)] | length == 3)' \
              <<< "$payload" >/dev/null
          }

          for attempt in 1 2 3 4; do
            if verify_release; then
              echo "Verified release $TAG and all three assets."
              exit 0
            fi

            if gh release view "$TAG" \
              --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              # Recover a partially created release instead of trying to
              # recreate the tag. Clobber makes upload retry idempotent.
              gh release upload "$TAG" \
                "$HEADSET" "$CONTROLLER" "$CHECKSUMS" \
                --clobber --repo "$GITHUB_REPOSITORY" || true
            else
              gh release create "$TAG" \
                "$HEADSET" "$CONTROLLER" "$CHECKSUMS" \
                --repo "$GITHUB_REPOSITORY" \
                --target "$GITHUB_SHA" \
                --title "ReverieVR Phone Test #$GITHUB_RUN_NUMBER" \
                --notes-file release/RELEASE-NOTES.md \
                --prerelease || true
            fi

            if verify_release; then
              echo "Verified release $TAG and all three assets."
              exit 0
            fi
            if (( attempt < 4 )); then
              echo "::warning::Release publication/read-back attempt $attempt failed; retrying."
              sleep $((attempt * 5))
            fi
          done
          echo "::error::Release publication or asset read-back failed after four attempts." >&2
          exit 1
