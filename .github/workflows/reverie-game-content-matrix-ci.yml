name: ReverieVR all-game content package contracts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reverie-game-content-matrix-ci.yml'
      - 'modules/game-identity-matrix.json'
      - 'scripts/modules/build-content-pack.py'
      - 'scripts/modules/verify-content-pack.py'
      - 'scripts/modules/verify-game-identity-matrix.py'
      - 'scripts/modules/release-package-identity.py'
      - 'scripts/modules/publish-module-release.py'
      - 'scripts/modules/test_release_package_identity.py'
      - 'scripts/modules/sign-catalog.py'
      - 'scripts/modules/test_sign_catalog_contract.py'
      - 'scripts/modules/prepare-catalog-candidate.py'
      - 'scripts/modules/test_prepare_catalog_candidate.py'
      - 'scripts/modules/test_all_game_content_packages.py'
      - 'scripts/modules/test-native-asset-scope.cpp'
      - 'app/src/main/jni/native/reverie_native_asset_scope.h'
      - 'app/src/main/assets/native/breakwater/**'
      - 'app/src/main/java/io/github/mrcalzon02/reverievr/GameModuleRegistry.java'
      - 'app/src/main/jni/Android.mk'
      - 'app/src/main/jni/native/reverie_native_host.cpp'
      - 'app/src/main/jni/native/omega_front_*.h'
      - 'app/src/main/jni/native/omega_front_module.cpp'
      - 'app/src/main/jni/native/gumball_armada_module.cpp'
      - 'app/src/main/jni/native/gumball_menu_layout.h'
      - 'app/src/main/jni/native/gumball_menu_hit.h'
      - 'app/src/test/native/gumball_menu_layout_test.cpp'
      - 'app/src/test/native/gumball_menu_hit_test.cpp'
      - 'app/src/test/native/gumball_armada_test.cpp'
      - 'app/src/test/native/gumball_ship_3d_test.cpp'
      - 'scripts/verify-gumball-armada.sh'
      - 'app/src/test/native/omega_front_*_test.cpp'
      - 'scripts/verify-omega-front-playability.sh'
      - 'scripts/modules/verify-omega-front-cc0.py'
      - 'app/src/main/assets/native/omega-front/rpg_cc0/**'

permissions:
  contents: read

jobs:
  verify-gumball-map-input:
    name: Gumball real chart selection functional gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile and verify actual map input, route-lock delay and controller focus
        shell: bash
        run: |
          set -euo pipefail
          for compiler in g++ clang++; do
            "$compiler" -std=c++17 -Wall -Wextra -Werror -pedantic \
              -Iapp/src/main/jni/native \
              app/src/test/native/gumball_menu_layout_test.cpp \
              -o "${RUNNER_TEMP}/gumball-map-${compiler}"
            "${RUNNER_TEMP}/gumball-map-${compiler}"
            "$compiler" -std=c++17 -Wall -Wextra -Werror -pedantic \
              -Iapp/src/main/jni/native \
              app/src/test/native/gumball_menu_hit_test.cpp \
              -o "${RUNNER_TEMP}/gumball-hit-${compiler}"
            "${RUNNER_TEMP}/gumball-hit-${compiler}"
          done

  verify-gumball-controls:
    name: Gumball Armada real route selection and gameplay regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify real chart focus, delayed lane launch and complete Gumball gameplay
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify-gumball-armada.sh

  verify-omega-front:
    name: Omega Front real C++ boot-to-battle regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Execute every Omega Front tactical and campaign regression
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify-omega-front-playability.sh

  verify-all-games:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify native game identity alignment across Java C++ build and release tooling
        run: python3 scripts/modules/verify-game-identity-matrix.py
      - name: Test independent game content builds, namespaces and pack integrity
        run: python3 -m unittest discover -s scripts/modules -p 'test_all_game_content_packages.py' -v
      - name: Verify native game-owned asset resolver and forbidden cross-game paths
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iapp/src/main/jni/native \
            scripts/modules/test-native-asset-scope.cpp -o "${RUNNER_TEMP}/game-asset-scope"
          "${RUNNER_TEMP}/game-asset-scope"
      - name: Package real Breakwater Beckenburg models without modifying the APK
        run: |
          python3 scripts/modules/build-content-pack.py \
            --id breakwater-battery \
            --source app/src/main/assets/native/breakwater \
            --output "${RUNNER_TEMP}/breakwater-models-r1.rvpack" \
            --revision 1 --version 0.1.0
          python3 scripts/modules/verify-content-pack.py "${RUNNER_TEMP}/breakwater-models-r1.rvpack"
          mkdir -p validation
          cp "${RUNNER_TEMP}/breakwater-models-r1.rvpack" validation/
          sha256sum validation/*.rvpack > validation/SHA256.txt
      - name: Build and verify real Red Ledger icon content update
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/red-ledger/assets/icons" validation
          cp app/src/main/assets/native/red-ledger/icons/icon_*.png \
             "${RUNNER_TEMP}/red-ledger/assets/icons/"
          test "$(find "${RUNNER_TEMP}/red-ledger/assets/icons" -type f | wc -l)" -eq 24
          python3 scripts/modules/build-content-pack.py \
            --id between-deliveries-red-ledger \
            --source "${RUNNER_TEMP}/red-ledger/assets" \
            --output validation/red-ledger-icons-r1.rvpack \
            --revision 1 --version 0.1.0
          python3 scripts/modules/verify-content-pack.py \
            validation/red-ledger-icons-r1.rvpack
          python3 - <<'PY'
          import zipfile
          path="validation/red-ledger-icons-r1.rvpack"
          with zipfile.ZipFile(path) as z:
              content=[p for p in z.namelist() if p.startswith(
                  "assets/native/red-ledger/icons/") and p.endswith(".png")]
              assert len(content)==24,(len(content),content)
          print("PASS: all 24 real Red Ledger shop icon paths packaged")
          PY
      - name: Build and verify real Omega Front terrain and unit sprite update
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/modules/build-content-pack.py \
            --id omega-front \
            --source app/src/main/assets/native/omega-front \
            --output validation/omega-front-art-r1.rvpack \
            --revision 1 --version 0.1.0
          python3 scripts/modules/verify-content-pack.py \
            validation/omega-front-art-r1.rvpack
          python3 - <<'PY'
          import pathlib,re,zipfile
          renderer=pathlib.Path(
              "app/src/main/jni/native/omega_front_texture_renderer.h").read_text()
          referenced=re.findall(r'"(native/omega-front/[^"]+\.png)"',renderer)
          with zipfile.ZipFile("validation/omega-front-art-r1.rvpack") as z:
              members=set(z.namelist())
              missing=sorted("assets/"+p for p in referenced
                             if "assets/"+p not in members)
              assert len(referenced)==108,(len(referenced),missing)
              assert not missing,missing
          print("PASS:",len(referenced),
                "actual native Omega Front sprite paths match signed-format pack")
          PY
      - name: Validate real 16x16 CC0 RPG tile sources and all renderer selections
        run: python3 scripts/modules/verify-omega-front-cc0.py
      - name: Seal genuine multi-game offline test packages
        run: sha256sum validation/*.rvpack > validation/SHA256.txt
      - name: Check release-to-game ID version and publisher certificate preflight
        run: python3 -m unittest discover -s scripts/modules -p 'test_release_package_identity.py' -v
      - name: Verify signed catalog duplicate, ownership and anti-rollback controls
        run: python3 -m unittest discover -s scripts/modules -p 'test_sign_catalog_contract.py' -v
      - name: Verify proposed catalog update creation and strict receipt binding
        run: python3 -m unittest discover -s scripts/modules -p 'test_prepare_catalog_candidate.py' -v
      - name: Test prior release and ZIP integrity contracts
        run: |
          python3 -m unittest discover -s scripts/modules -p 'test_verify_content_pack.py' -v
          python3 -m unittest discover -s scripts/modules -p 'test_publish_module_release.py' -v
      - name: Retain real game model content package for manual hub import testing
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: reverie-real-native-content-probes-${{ github.run_id }}
          path: validation/
          retention-days: 14
          if-no-files-found: error
