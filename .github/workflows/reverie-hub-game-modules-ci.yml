name: ReverieVR hub game acquisition integration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reverie-hub-game-modules-ci.yml'
      - 'app/src/androidTest/java/io/github/mrcalzon02/reverievr/HubGameModulesInstrumentedTest.java'
      - 'app/src/androidTest/java/io/github/mrcalzon02/reverievr/DownloadedNativeGameAssetsInstrumentedTest.java'
      - 'app/src/main/jni/native/omega_front_*.h'
      - 'app/src/main/jni/native/omega_front_module.cpp'
      - 'app/src/main/jni/native/omega_front_png.h'
      - 'app/src/test/native/omega_front_png_test.cpp'
      - 'app/src/main/assets/native/omega-front/rpg_cc0/**'
      - 'app/src/main/java/io/github/mrcalzon02/reverievr/VrShellRenderer.java'
      - 'modules/game-identity-matrix.json'
      - 'scripts/modules/verify-game-identity-matrix.py'
      - 'scripts/ci/verify-integrated-game-functional-coverage.py'
      - 'scripts/ci/verify-installed-native-game-captures.py'
      - 'app/src/main/java/io/github/mrcalzon02/reverievr/GameModule*.java'
      - 'app/src/main/java/io/github/mrcalzon02/reverievr/Companion*.java'
      - 'app/src/main/java/io/github/mrcalzon02/reverievr/RvPack*.java'
      - 'app/src/main/java/io/github/mrcalzon02/reverievr/NativeModuleRuntime.java'
      - 'app/src/main/jni/native/reverie_native_host.cpp'
      - 'app/src/main/jni/native/breakwater_module.cpp'
      - 'app/src/main/jni/native/reverie_native_asset_scope.h'
      - 'app/src/test/native/native_asset_scope_test.cpp'
      - 'app/build.gradle'
      - 'game-apps/test-chamber/build.gradle'
      - 'game-apps/breakwater/**'
      - 'settings.gradle'

permissions:
  contents: read

concurrency:
  group: reverie-hub-game-acquisition-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-installed-hub:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable Android emulator acceleration
        shell: bash
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Install pinned Android build tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then SDKMANAGER="$(command -v sdkmanager || true)"; fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.14206865' 'cmake;3.22.1'
      - name: Fetch authoritative native hub build inputs
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew scripts/fetch-dosbox-pure.sh scripts/fetch-doom-shareware.sh scripts/fetch-kens-labyrinth.sh scripts/fetch-jetpack.sh scripts/verify-build-bootstrap.sh
          ./scripts/fetch-dosbox-pure.sh
          ./scripts/fetch-doom-shareware.sh
          ./scripts/fetch-kens-labyrinth.sh
          ./scripts/fetch-jetpack.sh
          ./scripts/verify-build-bootstrap.sh
      - name: Build real ReverieVR hub + signed-test companion + Android tests
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++17 -Wall -Wextra -Werror \
            app/src/test/native/native_asset_scope_test.cpp \
            -o "${RUNNER_TEMP}/reverie-native-asset-scope-test"
          "${RUNNER_TEMP}/reverie-native-asset-scope-test"
          python3 scripts/modules/verify-omega-front-cc0.py
          python3 scripts/ci/verify-integrated-game-functional-coverage.py
          c++ -std=c++17 -Wall -Wextra -Werror \
            app/src/test/native/omega_front_png_test.cpp -lz \
            -o "${RUNNER_TEMP}/reverie-omega-front-png-test"
          "${RUNNER_TEMP}/reverie-omega-front-png-test" \
            app/src/main/assets/native/omega-front/rpg_cc0/*.png
          ./gradlew --no-daemon --stacktrace -PcompanionEmulatorAbi=true \
            :app:assembleDebug :app:assembleDebugAndroidTest \
            :companion-test-chamber:assembleDebug \
            :companion-breakwater:assembleDebug
          mkdir -p validation/hub
          HUB="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -type f -print -quit)"
          CHAMBER="$(find game-apps/test-chamber/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -type f -print -quit)"
          TEST="$(find app/build/outputs/apk/androidTest/debug -maxdepth 1 -name '*.apk' -type f -print -quit)"
          BREAKWATER="$(find game-apps/breakwater/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -type f -print -quit)"
          test -f "$HUB" && test -f "$CHAMBER" && test -f "$TEST" && test -f "$BREAKWATER"
          python3 - "$HUB" <<'PY'
          import json,sys,zipfile
          from pathlib import Path
          hub=Path(sys.argv[1])
          games=json.loads(Path("modules/game-identity-matrix.json").read_text())["games"]
          with zipfile.ZipFile(hub) as archive:
              names=set(archive.namelist())
              expected={"lib/x86_64/libreverie_native_host.so"}
              expected.update("lib/x86_64/"+g["native_library"] for g in games)
              missing=sorted(expected-names)
              if missing:
                  raise SystemExit("Hub is missing game binaries: "+str(missing))
          print("PASS: all",len(games),"native game libraries packaged in real hub APK")
          PY
          unzip -Z -1 "$CHAMBER" | grep -Fx 'lib/x86_64/libreverie_companion_test_chamber.so'
          unzip -Z -1 "$BREAKWATER" | grep -Fx 'lib/x86_64/libreverie_companion_breakwater.so'
          for MODEL in concrete_block_1 wooden_crate_1 ammo_box_mp_1; do
            unzip -Z -1 "$BREAKWATER" |
              grep -Fx "assets/native/breakwater/beckenburg/${MODEL}.bwm"
          done
          python3 scripts/modules/verify-companion-contract.py
          cp "$HUB" validation/hub/ReverieVR-hub-emulator.apk
          cp "$CHAMBER" validation/hub/TestChamber-companion-emulator.apk
          cp "$BREAKWATER" validation/hub/Breakwater-companion-emulator.apk
          cp "$TEST" validation/hub/ReverieVR-module-tests.apk
          sha256sum validation/hub/*.apk > validation/hub/SHA256.txt
      - name: Execute real hub game management on Android 10
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            set -eu
            mkdir -p validation/hub
            adb logcat -c
            adb install -r validation/hub/ReverieVR-hub-emulator.apk
            adb install -r validation/hub/TestChamber-companion-emulator.apk
            adb install -r validation/hub/Breakwater-companion-emulator.apk
            adb install -r validation/hub/ReverieVR-module-tests.apk
            adb shell pm list packages | grep -Fx 'package:io.github.mrcalzon02.reverievr'
            adb shell pm list packages | grep -Fx 'package:io.github.mrcalzon02.reverievr.game.testchamber'
            adb shell pm list packages | grep -Fx 'package:io.github.mrcalzon02.reverievr.game.breakwater'
            adb shell am start -W -n io.github.mrcalzon02.reverievr/.MainActivity | tee validation/hub/hub-main-launch.txt
            # Only independent hub/game tests belong in the full-install suite. The staged APK-upgrade tests require their own pre-upgrade sentinel and run in the Recovery Simulation workflow.
            adb shell am instrument -w -r -e class io.github.mrcalzon02.reverievr.HubGameModulesInstrumentedTest,io.github.mrcalzon02.reverievr.DownloadedNativeGameAssetsInstrumentedTest io.github.mrcalzon02.reverievr.test/androidx.test.runner.AndroidJUnitRunner | tee validation/hub/instrumentation-output.txt
            adb logcat -d -v time > validation/hub/logcat.txt
            grep -F 'OK (12 tests)' validation/hub/instrumentation-output.txt
            grep -F 'PASS all 15 registered native game initial menus captured from installed Android GLES2 implementation' validation/hub/logcat.txt
            adb exec-out run-as io.github.mrcalzon02.reverievr cat files/native-menu-capture.csv > validation/hub/native-menu-capture.csv
            for GAME in $(python3 -c 'import json; print(" ".join(g["id"] for g in json.load(open("modules/game-identity-matrix.json"))["games"]))'); do adb exec-out run-as io.github.mrcalzon02.reverievr cat "files/native-menu-${GAME}.png" > "validation/hub/native-menu-${GAME}.png"; test -s "validation/hub/native-menu-${GAME}.png"; done
            grep -F 'PASS real downloaded between-deliveries-red-ledger assets=24' validation/hub/logcat.txt
            grep -F 'PASS real downloaded omega-front assets=141' validation/hub/logcat.txt
            grep -F 'PASS omega-front emulator nativeLaunch=true publicGames=true travel=true deploy=true controllerOrder=true combatStep=true stereoGles2=true saveResume=true' validation/hub/logcat.txt
            adb exec-out run-as io.github.mrcalzon02.reverievr cat files/omega-front-ci-tactical.png > validation/hub/omega-front-tactical.png
            test -s validation/hub/omega-front-tactical.png
            python3 -c 'from pathlib import Path; image=Path("validation/hub/omega-front-tactical.png").read_bytes(); assert image.startswith(bytes((137,80,78,71,13,10,26,10))), "No actual GLES2 tactical PNG"; print("PASS Omega Front GLES2 tactical framebuffer captured from Android")'
            grep -F 'Game verified-pack asset id=between-deliveries-red-ledger' validation/hub/logcat.txt
            grep -F 'Game verified-pack asset id=omega-front' validation/hub/logcat.txt
            # Print the native count before retaining the full 108/108 gate.
            grep -F 'Tactical PNG textures loaded:' validation/hub/logcat.txt
            grep -F 'Tactical PNG textures loaded: 108/108' validation/hub/logcat.txt
            grep -F 'Authentic BWM1 models loaded 5/5' validation/hub/logcat.txt
            # Emulator action executes each script line as its own sh -c call.
            # Keep the five independent verified-pack assertions on ONE line.
            for MODEL in concrete_block_1 wooden_crate_1 ammo_box_mp_1 owner_boat_rowboat owner_apc_armor; do grep -F "Breakwater verified-pack asset native/breakwater/beckenburg/${MODEL}.bwm" validation/hub/logcat.txt; done
            adb exec-out screencap -p > validation/hub/hub-screen.png
      - name: Enforce real GLES2 boot and framebuffer evidence for every registered game
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/verify-installed-native-game-captures.py validation/hub
      - name: Keep APKs and actual acquisition/update test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reverie-hub-game-acquisition-${{ github.run_id }}
          path: validation/hub/
          retention-days: 14
          if-no-files-found: warn
