name: Deploy diagnostic intake

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: diagnostic-intake
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required deployment values
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DIAGNOSTIC_GITHUB_APP_ID: ${{ secrets.DIAGNOSTIC_GITHUB_APP_ID }}
          DIAGNOSTIC_GITHUB_APP_PRIVATE_KEY: ${{ secrets.DIAGNOSTIC_GITHUB_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$DIAGNOSTIC_GITHUB_APP_ID"
          test -n "$DIAGNOSTIC_GITHUB_APP_PRIVATE_KEY"

      - name: Deploy Worker and runtime secrets
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: diagnostic-intake
          command: deploy
          secrets: |
            DIAGNOSTIC_GITHUB_APP_ID
            DIAGNOSTIC_GITHUB_APP_PRIVATE_KEY
        env:
          DIAGNOSTIC_GITHUB_APP_ID: ${{ secrets.DIAGNOSTIC_GITHUB_APP_ID }}
          DIAGNOSTIC_GITHUB_APP_PRIVATE_KEY: ${{ secrets.DIAGNOSTIC_GITHUB_APP_PRIVATE_KEY }}
