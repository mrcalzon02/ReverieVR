name: ReverieVR all integrated games — functional diagnostics

# Source-level game behavior checks. The independent hub Android CI executes
# EVERY registered native library via Java/JNI/GLES2 and archives 15 frames.
# No cosmetic screenshot-diff/visual-style test blocks functional acceptance.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reverie-all-integrated-games-ci.yml'
      - 'modules/game-identity-matrix.json'
      - 'scripts/ci/verify-integrated-game-functional-coverage.py'
      - 'scripts/verify-native-vector-font.py'
      - 'scripts/verify-guess-the-door.sh'
      - 'app/src/test/native/guess_the_door_game_test.cpp'
      - 'app/src/main/jni/native/guess_the_door_game.h'
      - 'app/src/main/jni/Android.mk'
      - 'scripts/verify-gumball-armada.sh'
      - 'scripts/verify-omega-front-playability.sh'
      - 'scripts/perf/**'
      - 'app/src/main/jni/native/**'
      - 'app/src/test/native/**'
      - 'app/src/main/assets/native/breakwater/**'
      - 'app/src/main/assets/native/red-ledger/**'

permissions:
  contents: read

jobs:
  verify-registry:
    name: All 16 native game IDs have real runtime or logic acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check every game is mapped to a real functional or Android JNI/GLES2 test
        run: |
          set -euo pipefail
          python3 scripts/modules/verify-game-identity-matrix.py
          python3 scripts/ci/verify-integrated-game-functional-coverage.py
          python3 scripts/verify-native-vector-font.py

  breakwater-combat:
    name: Breakwater Battery combat, campaign, waves, purchases and aiming
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Execute real coastal-defense mechanics (both compilers)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation/breakwater
          # Full native module lifecycle requires GLES2 headers even though
          # its deterministic input/save test never creates a GL context.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgles2-mesa-dev
          # Capture exact host compiler/assertion failures as an artifact,
          # not only ephemeral Actions step text.
          exec > >(tee validation/breakwater/functional.log) 2>&1
          for cc in g++ clang++; do
            for game_test in breakwater_campaign breakwater_persistence breakwater_defense_points breakwater_aircraft_mesh breakwater_cannon_trajectory breakwater_wave_schedule breakwater_wave_threat breakwater_armor breakwater_invasion_units breakwater_shop_feedback breakwater_menu_layout; do
              echo "FUNCTIONAL TEST: $game_test via $cc"
              extra=()
              if [[ "$game_test" == breakwater_campaign || "$game_test" == breakwater_persistence ]]; then
                extra=(app/src/main/jni/native/breakwater_campaign.cpp)
              fi
              link=()
              if [[ "$game_test" == breakwater_persistence ]]; then
                link=(-lGLESv2) # Actual module lifecycle uses GLES2 symbols, no GL context
              fi
              "$cc" -std=c++17 -O1 -Wall -Wextra -Werror -Wpedantic \
                -Iapp/src/main/jni/native \
                "app/src/test/native/${game_test}_test.cpp" "${extra[@]}" \
                -o "${RUNNER_TEMP}/${cc}-${game_test}" -lz "${link[@]}"
              "${RUNNER_TEMP}/${cc}-${game_test}"
            done
          done
          echo 'PASS: Breakwater Battery core gameplay controls/campaign'
      - name: Preserve failed Breakwater compiler and assertion trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: breakwater-core-diagnostics-${{ github.run_id }}
          path: validation/breakwater/functional.log
          if-no-files-found: warn
          retention-days: 7

      - name: Rasterize paid Breakwater rack selection in real Mesa GLES2 stereo
        shell: bash
        env:
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends libegl1-mesa-dev libgl1-mesa-dri
          mkdir -p validation/breakwater/raster
          BREAKWATER_CAPTURE_DIR=validation/breakwater/raster \
            bash scripts/verify-breakwater-world-gl.sh | tee validation/breakwater/raster.log
          grep -F 'PASS: Breakwater paid rack GLES2 selected-mount stereo raster and fire' validation/breakwater/raster.log
      - name: Preserve Breakwater stereo framebuffer proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: breakwater-mounted-rack-${{ github.run_id }}
          path: |
            validation/breakwater/raster.log
            validation/breakwater/raster/breakwater-paid-*.ppm
          if-no-files-found: warn
          retention-days: 7

  red-ledger:
    name: Red Ledger patron, faction, economy and trade simulation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run factual bar-economy and customer action tests, not cosmetic geometry
        shell: bash
        run: |
          set -euo pipefail
          for cc in g++ clang++; do
            for game_test in red_ledger_simulation red_ledger_faction_integration red_ledger_trade red_ledger_wholesale red_ledger_stock_layout red_ledger_clientele red_ledger_signage red_ledger_original_assets; do
              echo "FUNCTIONAL TEST: $game_test via $cc"
              extra=()
              if [[ "$game_test" == red_ledger_simulation || "$game_test" == red_ledger_faction_integration || "$game_test" == red_ledger_wholesale ]]; then
                extra=(app/src/main/jni/native/red_ledger_simulation.cpp)
              fi
              link=()
              if [[ "$game_test" == red_ledger_original_assets ]]; then
                link=(-lz)
              fi
              "$cc" -std=c++17 -O1 -Wall -Wextra -Werror -Wpedantic \
                -Iapp/src/main/jni/native \
                "app/src/test/native/${game_test}_test.cpp" "${extra[@]}" \
                -o "${RUNNER_TEMP}/${cc}-${game_test}" "${link[@]}"
              if [[ "$game_test" == red_ledger_original_assets ]]; then
                "${RUNNER_TEMP}/${cc}-${game_test}" "$GITHUB_WORKSPACE"
              else
                "${RUNNER_TEMP}/${cc}-${game_test}"
              fi
            done
          done
          echo 'PASS: Red Ledger functional patrons, trade and stock'

      - name: Execute Red Ledger native EGL/GLES2 receipt and checkpoint lifecycle
        shell: bash
        env:
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1-mesa-dev libgles2-mesa-dev libgl1-mesa-dri
          mkdir -p validation/red-ledger/module
          g++ -std=c++17 -O1 -Wall -Wextra -Wpedantic \
            -Iapp/src/main/jni/native -Iapp/src/test/native \
            app/src/test/native/red_ledger_module_save_test.cpp \
            app/src/main/jni/native/red_ledger_simulation.cpp \
            app/src/main/jni/native/procedural_material_atlas.cpp \
            app/src/main/jni/native/red_ledger_static_geometry.cpp \
            -lEGL -lGLESv2 -lz -o "$RUNNER_TEMP/red-ledger-module"
          "$RUNNER_TEMP/red-ledger-module" validation/red-ledger/module | tee validation/red-ledger/module.log
          grep -F 'PASS_RED_PREMIUM_PENDING' validation/red-ledger/module.log

  guess-the-door:
    name: Guess the Door clues, saves, module focus and lever gameplay
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Khronos GLES2 for genuine guest module lifecycle tests
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgles2-mesa-dev
      - name: Execute real door logic, save codec and native module input in both compilers
        shell: bash
        run: |
          set -euo pipefail
          for cc in g++ clang++; do
            echo "Guess the Door simulation and save codec via $cc"
            CXX="$cc" bash scripts/verify-guess-the-door.sh
            echo "Guess the Door real module pause, focus and checkpoint via $cc"
            "$cc" -std=c++17 -O0 -Wall -Wextra -Wpedantic -Werror \
              -Iapp/src/main/jni/native \
              app/src/test/native/guess_the_door_persistence_test.cpp \
              -lGLESv2 -lz -o "${RUNNER_TEMP}/guess-module-${cc}"
            "${RUNNER_TEMP}/guess-module-${cc}"
          done

  classic-eight:
    name: Chess, Checkers, Go, Reversi, Pong, Snake, Breakout and Chutes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run actual classic rules, AI, game input, paddle physics and save lifecycle regressions
        shell: bash
        run: |
          set -euo pipefail
          # The existing save verifier compiles the real native module for all
          # eight games; that source includes Khronos GLES2 headers.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgles2-mesa-dev
          for cc in g++ clang++; do
            for game_test in classic_games classic_pong_dynamics; do
              echo "FUNCTIONAL TEST: $game_test via $cc"
              "$cc" -std=c++17 -O1 -pthread -Wall -Wextra -Werror -Wpedantic \
                -Iapp/src/main/jni/native \
                "app/src/test/native/${game_test}_test.cpp" \
                -o "${RUNNER_TEMP}/${cc}-${game_test}"
              "${RUNNER_TEMP}/${cc}-${game_test}"
            done
            echo "FUNCTIONAL TEST: classic save codec and eight real module lifecycles via $cc"
            CXX="$cc" bash scripts/verify-classic-saves.sh
          done
          echo 'PASS: all eight native classic game logic families, saves and module lifecycles'

  recon-missions:
    name: Lantern Desk reconnaissance and Iron Sight patrol-to-debrief
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Exercise real mission transitions and choices in both recon games
        shell: bash
        run: |
          set -euo pipefail
          for cc in g++ clang++; do
            for game_test in lantern_desk_simulation forward_detachment_simulation; do
              extra=()
              if [[ "$game_test" == lantern_desk_simulation ]]; then
                extra=(app/src/main/jni/native/lantern_desk_simulation.cpp)
              else
                extra=(app/src/main/jni/native/forward_detachment_simulation.cpp)
              fi
              "$cc" -std=c++17 -O1 -Wall -Wextra -Werror -Wpedantic \
                -Iapp/src/main/jni/native \
                "app/src/test/native/${game_test}_test.cpp" "${extra[@]}" \
                -o "${RUNNER_TEMP}/${cc}-${game_test}"
              "${RUNNER_TEMP}/${cc}-${game_test}"
            done
          done
          echo 'PASS: Lantern Desk and Iron Sight complete mission cycles'

  gumball-campaign:
    name: Gumball Armada route select, shipyard and actual combat simulation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Execute full existing real Gumball Armada gameplay suite
        run: bash scripts/verify-gumball-armada.sh
      - name: Install real GLES2 headers for Gumball module lifecycle regression
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1-mesa-dev libgles2-mesa-dev libgl1-mesa-dri
      - name: Run actual hosted Gumball flight focus, persistence and stereo in GCC and Clang
        shell: bash
        env:
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          mkdir -p validation/gumball-module
          for cc in g++ clang++; do
            "$cc" -std=c++17 -O1 -Wall -Wextra -Werror -Wpedantic \
              -Iapp/src/main/jni/native -Iapp/src/test/native \
              app/src/test/native/gumball_module_save_test.cpp \
              -lEGL -lGLESv2 -lz -o "${RUNNER_TEMP}/gumball-module-${cc}"
            "${RUNNER_TEMP}/gumball-module-${cc}" validation/gumball-module \
              | tee "validation/gumball-module/${cc}.log"
            grep -F 'PASS Gumball actual module shell loss:' \
              "validation/gumball-module/${cc}.log"
          done

  omega-campaign:
    name: Omega Front boot-to-battle, campaign, sprites and input regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Execute full existing real Omega Front campaign suite
        run: bash scripts/verify-omega-front-playability.sh

  native-runtime:
    name: Shared native ABI, asset-scoping and companion contracts
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Ensure native host ABI and game isolation remain operational
        shell: bash
        run: |
          set -euo pipefail
          for cc in g++ clang++; do
            for game_test in native_abi_contract native_asset_scope; do
              "$cc" -std=c++17 -O1 -Wall -Wextra -Werror -Wpedantic \
                -Iapp/src/main/jni/native \
                "app/src/test/native/${game_test}_test.cpp" \
                -o "${RUNNER_TEMP}/${cc}-${game_test}"
              "${RUNNER_TEMP}/${cc}-${game_test}"
            done
          done
          echo 'PASS: native game entry ABI and scoped asset reads'

  vr-endurance-sampler:
    name: Offline S9 endurance sampler regression (no physical phone)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run battery/thermal parsing and non-invasive capture regressions
        run: python3 scripts/perf/test_s9_session_sampler.py

