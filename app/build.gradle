plugins {
    id "com.android.application"
}

def doomSharewareArchive = rootProject.file(
    "third_party/doom-shareware/payload/default-content/doom19s.zip"
)
def excludeDoomShareware =
    project.hasProperty("excludeDoomShareware")
def bundleDoomShareware =
    !excludeDoomShareware && doomSharewareArchive.isFile()

def dosboxPureAndroidMk = rootProject.file(
    "third_party/dosbox-pure/src/jni/Android.mk"
)
def dosRuntimeBuilt = dosboxPureAndroidMk.isFile()

def diagnosticIntakeUrl =
    (project.findProperty("diagnosticIntakeUrl") ?: "")
        .toString()
        .replace("\r", "")
        .replace("\n", "")
def diagnosticIntakeUrlEscaped =
    diagnosticIntakeUrl
        .replace("\\", "\\\\")
        .replace("\"", "\\\"")

def phoneTestRunNumber =
    (project.findProperty("phoneTestRunNumber") ?: "0")
        .toString()
        .toInteger()
def phoneTestRunAttempt =
    (project.findProperty("phoneTestRunAttempt") ?: "0")
        .toString()
        .toInteger()
def phoneTestVersionCode =
    phoneTestRunNumber > 0
        ? (
            phoneTestRunNumber * 1000
                + Math.max(phoneTestRunAttempt, 1)
        )
        : 1
def phoneTestSignerSha256 =
    (project.findProperty("phoneTestSignerSha256") ?: "")
        .toString()
        .replaceAll("[^A-Fa-f0-9]", "")
        .toLowerCase()
def sourceRevision =
    (project.findProperty("sourceRevision") ?: "local")
        .toString()
        .replaceAll("[^A-Za-z0-9._-]", "")
def sourceRevisionEscaped =
    sourceRevision
        .replace("\\", "\\\\")
        .replace("\"", "\\\"")

def phoneTestKeystorePath =
    (project.findProperty("phoneTestKeystorePath") ?: "")
        .toString()
def phoneTestStorePassword =
    (project.findProperty("phoneTestStorePassword") ?: "")
        .toString()
def phoneTestKeyAlias =
    (project.findProperty("phoneTestKeyAlias") ?: "")
        .toString()
def phoneTestKeyPassword =
    (project.findProperty("phoneTestKeyPassword") ?: "")
        .toString()
def phoneTestSigningConfigured =
    !phoneTestKeystorePath.isEmpty()
        && !phoneTestStorePassword.isEmpty()
        && !phoneTestKeyAlias.isEmpty()
        && !phoneTestKeyPassword.isEmpty()
        && file(phoneTestKeystorePath).isFile()
def updateChannelEnabled =
    phoneTestSigningConfigured
        && phoneTestRunNumber > 0
        && phoneTestSignerSha256.length() == 64

android {
    namespace = "io.github.mrcalzon02.reverievr"
    compileSdk = 36

    defaultConfig {
        applicationId = "io.github.mrcalzon02.reverievr"
        minSdk = 26
        targetSdk = 36
        versionCode = phoneTestVersionCode
        versionName = "0.1.0-dev"
        buildConfigField(
            "boolean",
            "DOS_RUNTIME_BUILT",
            dosRuntimeBuilt.toString()
        )

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
        externalNativeBuild {
            ndkBuild {
                arguments(
                    "APP_PLATFORM=android-26",
                    "APP_STL=c++_static"
                )
            }
        }
        buildConfigField(
            "boolean",
            "DOOM_SHAREWARE_BUNDLED",
            bundleDoomShareware.toString()
        )
        buildConfigField(
            "String",
            "DIAGNOSTIC_INTAKE_URL",
            "\"${diagnosticIntakeUrlEscaped}\""
        )
        buildConfigField(
            "int",
            "PHONE_TEST_RUN_NUMBER",
            phoneTestRunNumber.toString()
        )
        buildConfigField(
            "int",
            "PHONE_TEST_RUN_ATTEMPT",
            phoneTestRunAttempt.toString()
        )
        buildConfigField(
            "String",
            "SOURCE_REVISION",
            "\"${sourceRevisionEscaped}\""
        )
        buildConfigField(
            "boolean",
            "UPDATE_CHANNEL_ENABLED",
            updateChannelEnabled.toString()
        )
        buildConfigField(
            "String",
            "DISTRIBUTION_SIGNER_SHA256",
            "\"" + phoneTestSignerSha256 + "\""
        )
    }

    signingConfigs {
        if (phoneTestSigningConfigured) {
            phoneTest {
                storeFile = file(phoneTestKeystorePath)
                storePassword = phoneTestStorePassword
                keyAlias = phoneTestKeyAlias
                keyPassword = phoneTestKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            debuggable = true
        }

        phoneTest {
            debuggable = false
            minifyEnabled = false
            shrinkResources = false
            matchingFallbacks = ["release", "debug"]

            if (phoneTestSigningConfigured) {
                signingConfig = signingConfigs.phoneTest
            }
        }

        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles(
                getDefaultProguardFile("proguard-android-optimize.txt"),
                "proguard-rules.pro"
            )
        }
    }

    sourceSets {
        main {
            if (bundleDoomShareware) {
                assets.srcDir(
                    rootProject.file(
                        "third_party/doom-shareware/payload"
                    )
                )
            }
        }
    }

    externalNativeBuild {
        ndkBuild {
            path = file("src/main/jni/Android.mk")
        }
    }

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(":cardboard")
    implementation "com.google.protobuf:protobuf-javalite:3.19.4"
    testImplementation "junit:junit:4.13.2"
}


tasks.configureEach { task ->
    if (task.name == "preReleaseBuild") {
        task.doFirst {
            if (!excludeDoomShareware
                && !doomSharewareArchive.isFile()) {
                throw new GradleException(
                    "Release builds include DOOM Shareware v1.9 by default. "
                        + "Run scripts/fetch-doom-shareware.sh "
                        + "(or .bat), or pass "
                        + "-PexcludeDoomShareware for a build that "
                        + "intentionally omits the shareware content."
                )
            }
        }
    }
}
