plugins {
    id "com.android.application"
}

// Public-distribution guard: the Valve CC BY-NC-SA mesh must not silently
// enter an APK through Android's automatic src/main/assets packaging.
// A separate user-controlled importer may be implemented later.
def restrictedSteamControllerArchive =
    file("src/main/assets/steam_controller_2015/handoff.zip")
if (restrictedSteamControllerArchive.isFile()) {
    throw new GradleException(
        "Restricted Steam Controller CAD-derived archive is in the "
            + "automatically packaged Android assets directory. Move it "
            + "outside app/src/main/assets; the default distribution "
            + "must use the procedurally rendered controller fallback."
    )
}

def doomSharewareArchive = rootProject.file(
    "third_party/doom-shareware/payload/default-content/doom19s.zip"
)
def excludeDoomShareware =
    project.hasProperty("excludeDoomShareware")
def bundleDoomShareware =
    !excludeDoomShareware && doomSharewareArchive.isFile()

def dosboxPureAndroidMk = rootProject.file(
    "third_party/dosbox-pure/src/jni/Android.mk"
)
def dosRuntimeBuilt = dosboxPureAndroidMk.isFile()

def diagnosticIntakeUrl =
    (project.findProperty("diagnosticIntakeUrl") ?: "")
        .toString()
        .replace("\r", "")
        .replace("\n", "")
def diagnosticIntakeUrlEscaped =
    diagnosticIntakeUrl
        .replace("\\", "\\\\")
        .replace("\"", "\\\"")

def phoneTestRunNumber =
    (project.findProperty("phoneTestRunNumber") ?: "0")
        .toString()
        .toInteger()
def phoneTestRunAttempt =
    (project.findProperty("phoneTestRunAttempt") ?: "0")
        .toString()
        .toInteger()
def phoneTestVersionCode =
    phoneTestRunNumber > 0
        ? (
            phoneTestRunNumber * 1000
                + Math.max(phoneTestRunAttempt, 1)
        )
        : 1
def phoneTestSignerSha256 =
    (project.findProperty("phoneTestSignerSha256") ?: "")
        .toString()
        .replaceAll("[^A-Fa-f0-9]", "")
        .toLowerCase()
def sourceRevision =
    (project.findProperty("sourceRevision") ?: "local")
        .toString()
        .replaceAll("[^A-Za-z0-9._-]", "")
def sourceRevisionEscaped =
    sourceRevision
        .replace("\\", "\\\\")
        .replace("\"", "\\\"")

def phoneTestKeystorePath =
    (project.findProperty("phoneTestKeystorePath") ?: "")
        .toString()
def phoneTestStorePassword =
    (project.findProperty("phoneTestStorePassword") ?: "")
        .toString()
def phoneTestKeyAlias =
    (project.findProperty("phoneTestKeyAlias") ?: "")
        .toString()
def phoneTestKeyPassword =
    (
        project.findProperty("phoneTestKeyPassword")
            ?: phoneTestStorePassword
    )
        .toString()
def phoneTestSigningConfigured =
    !phoneTestKeystorePath.isEmpty()
        && !phoneTestStorePassword.isEmpty()
        && !phoneTestKeyAlias.isEmpty()
        && !phoneTestKeyPassword.isEmpty()
        && file(phoneTestKeystorePath).isFile()
def updateChannelEnabled =
    phoneTestSigningConfigured
        && phoneTestRunNumber > 0
        && phoneTestSignerSha256.length() == 64


/*
 * Review-pending source MP3s are generated into debug / phoneTest only.
 * The 'release' variant cannot accidentally inherit these recordings.
 * Authoritative Git masters are verified on every staging run.
 */
def sourceMusicManifest = rootProject.file("music/source/manifest.json")
def sourceMusicMasters = rootProject.file("music/source/audio")
def sourceMusicPreview = layout.buildDirectory.dir("generated/sourceMusicPreview")
def stageSourceMusicPreview = tasks.register("stageSourceMusicPreview") {
    inputs.file(sourceMusicManifest)
    inputs.dir(sourceMusicMasters)
    outputs.dir(sourceMusicPreview)
    doLast {
        def manifest = new groovy.json.JsonSlurper().parse(sourceMusicManifest)
        if (manifest.schema != 1 ||
            manifest.binary_status != "source-binaries-checked-in" ||
            !(manifest.tracks instanceof List) || manifest.tracks.size() != 11) {
            throw new GradleException("Unverified source music inventory")
        }
        def digestOf = { File fileToHash ->
            def digester = java.security.MessageDigest.getInstance("SHA-256")
            fileToHash.withInputStream { input ->
                byte[] buf = new byte[65536]
                int read
                while ((read = input.read(buf)) != -1)
                    if (read > 0) digester.update(buf, 0, read)
            }
            return digester.digest().collect {
                String.format("%02x", it & 0xff)
            }.join("")
        }
        File out = sourceMusicPreview.get().asFile
        project.delete(out)
        File targetFolder = new File(out, "music/tracks")
        if (!targetFolder.mkdirs() && !targetFolder.isDirectory())
            throw new GradleException("Cannot create music preview staging")
        def ids = new HashSet<String>()
        def entries = [
            "# Source-preview music: pending commercial redistribution review",
            "# id<TAB>title<TAB>source<TAB>license<TAB>sha256"
        ]
        manifest.tracks.each { track ->
            String title = track.title.toString()
            String id = title.toLowerCase(java.util.Locale.ROOT)
                .replaceAll("[^a-z0-9]+", "-")
                .replaceAll('(^-|-$)', "")
            if (!id.matches("[a-z0-9][a-z0-9_-]{0,79}") ||
                !ids.add(id) ||
                track.license != "LicenseRef-Pending-Asset-Rights" ||
                track.filename != title + ".mp3")
                throw new GradleException("Invalid source music record: " + title)
            File master = new File(sourceMusicMasters, track.filename.toString())
            if (master.canonicalFile.parentFile != sourceMusicMasters.canonicalFile ||
                !master.isFile() || master.length() != (track.bytes as long) ||
                digestOf(master) != track.sha256)
                throw new GradleException("Source music hash/size mismatch: " + title)
            File staged = new File(targetFolder, id + ".mp3")
            java.nio.file.Files.copy(master.toPath(), staged.toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            if (digestOf(staged) != track.sha256)
                throw new GradleException("Staged music verification failed: " + title)
            entries << [id,title,"music/tracks/" + id + ".mp3",
                        "LicenseRef-Pending-Asset-Rights",track.sha256].join("\t")
        }
        new File(out,"music/source_preview.tsv").text =
            entries.join("\n") + "\n"
    }
}

android {
    // Native music player opens packaged Suno tracks as seekable FD slices.
    // Keep approved MP3/WAV assets uncompressed in the APK.
    androidResources {
        noCompress += ["mp3", "wav"]
    }
    namespace = "io.github.mrcalzon02.reverievr"
    compileSdk = 36

    defaultConfig {
        applicationId = "io.github.mrcalzon02.reverievr"
        minSdk = 26
        targetSdk = 36
        versionCode = phoneTestVersionCode
        versionName = "0.1.0-dev"
        buildConfigField(
            "boolean",
            "DOS_RUNTIME_BUILT",
            dosRuntimeBuilt.toString()
        )

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
        externalNativeBuild {
            ndkBuild {
                arguments(
                    "APP_PLATFORM=android-26",
                    "APP_STL=c++_static"
                )
            }
        }
        buildConfigField(
            "boolean",
            "DOOM_SHAREWARE_BUNDLED",
            bundleDoomShareware.toString()
        )
        buildConfigField(
            "String",
            "DIAGNOSTIC_INTAKE_URL",
            "\"${diagnosticIntakeUrlEscaped}\""
        )
        buildConfigField(
            "int",
            "PHONE_TEST_RUN_NUMBER",
            phoneTestRunNumber.toString()
        )
        buildConfigField(
            "int",
            "PHONE_TEST_RUN_ATTEMPT",
            phoneTestRunAttempt.toString()
        )
        buildConfigField(
            "String",
            "SOURCE_REVISION",
            "\"${sourceRevisionEscaped}\""
        )
        buildConfigField(
            "boolean",
            "UPDATE_CHANNEL_ENABLED",
            updateChannelEnabled.toString()
        )
        buildConfigField(
            "String",
            "DISTRIBUTION_SIGNER_SHA256",
            "\"" + phoneTestSignerSha256 + "\""
        )
    }

    signingConfigs {
        if (phoneTestSigningConfigured) {
            phoneTest {
                storeFile = file(phoneTestKeystorePath)
                storePassword = phoneTestStorePassword
                keyAlias = phoneTestKeyAlias
                keyPassword = phoneTestKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            debuggable = true
        }

        phoneTest {
            debuggable = false
            minifyEnabled = false
            shrinkResources = false
            matchingFallbacks = ["release", "debug"]

            if (phoneTestSigningConfigured) {
                signingConfig = signingConfigs.phoneTest
            }
        }

        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles(
                getDefaultProguardFile("proguard-android-optimize.txt"),
                "proguard-rules.pro"
            )
        }
    }

    sourceSets {
        debug {
            assets.srcDir(sourceMusicPreview)
        }
        phoneTest {
            assets.srcDir(sourceMusicPreview)
        }
        main {
            if (bundleDoomShareware) {
                assets.srcDir(
                    rootProject.file(
                        "third_party/doom-shareware/payload"
                    )
                )
            }
        }
    }

    externalNativeBuild {
        ndkBuild {
            path = file("src/main/jni/Android.mk")
        }
    }

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(":cardboard")
    implementation "com.google.protobuf:protobuf-javalite:3.19.4"
    // Optional read-only Windows SMB2/SMB3 import (Apache-2.0). No PC helper.
    implementation "com.hierynomus:smbj:0.15.0"
    testImplementation "junit:junit:4.13.2"
}


tasks.configureEach { task ->
    if (task.name in ["mergeDebugAssets", "mergePhoneTestAssets"]) {
        task.dependsOn(stageSourceMusicPreview)
    }
    if (task.name == "preReleaseBuild") {
        task.doFirst {
            if (!excludeDoomShareware
                && !doomSharewareArchive.isFile()) {
                throw new GradleException(
                    "Release builds include DOOM Shareware v1.9 by default. "
                        + "Run scripts/fetch-doom-shareware.sh "
                        + "(or .bat), or pass "
                        + "-PexcludeDoomShareware for a build that "
                        + "intentionally omits the shareware content."
                )
            }
        }
    }
}
