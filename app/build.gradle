plugins {
    id "com.android.application"
}

// Android's Variant Sources API requires a task-owned DirectoryProperty
// for generated assets. Gradle then carries the producer dependency into
// merge, lint, packaging and IDE source models for every build variant.
abstract class StageOwnerMusicTask extends DefaultTask {
    @org.gradle.api.tasks.OutputDirectory
    abstract org.gradle.api.file.DirectoryProperty getOutputDirectory()
}

// Gumball route artwork is derived from the approved text-free master sheet
// at build time. Only eight tiles with an actual Chart consumer are packaged;
// the multi-megabyte concept sheet stays outside APK inputs. No Pillow,
// network dependency or new Android runtime decoder is required.
abstract class StageGumballRouteArtTask extends DefaultTask {
    @org.gradle.api.tasks.InputFile
    abstract org.gradle.api.file.RegularFileProperty getSourceAtlas()
    @org.gradle.api.tasks.InputFile
    abstract org.gradle.api.file.RegularFileProperty getPipSheet()
    @org.gradle.api.tasks.InputFile
    abstract org.gradle.api.file.RegularFileProperty getLollySheet()
    @org.gradle.api.tasks.OutputDirectory
    abstract org.gradle.api.file.DirectoryProperty getOutputDirectory()

    @org.gradle.api.tasks.TaskAction
    void stage() {
        // Gradle runs on headless builders; never require an X11 display.
        System.setProperty("java.awt.headless", "true")
        def source = javax.imageio.ImageIO.read(sourceAtlas.get().asFile)
        if (source == null || source.width != 1672 || source.height != 941)
            throw new GradleException("Gumball approved Candy Cosmos atlas has unexpected dimensions")
        final int columns = 8, rows = 5, width = 96, height = 86
        // Exact cells of art/gumball/node_atlas.json; native registry uses
        // exactly these eight names. RGB565 is 16,520 bytes per route tile.
        def cells = [
            0: "gummy_world", 2: "chocolate_world",
            5: "ice_candy_world", 6: "citrus_world",
            8: "gas_giant", 14: "ring_world",
            24: "outpost_station", 33: "crystal_field"
        ]
        File outputRoot = outputDirectory.get().asFile
        project.delete(outputRoot)
        File dir = new File(outputRoot, "native/gumball/nodes")
        if (!dir.mkdirs() && !dir.isDirectory())
            throw new GradleException("Cannot create generated Gumball asset directory")
        cells.each { index, name ->
            int col = index % columns, row = index.intdiv(columns)
            int left = (col * source.width).intdiv(columns)
            int top = (row * source.height).intdiv(rows)
            int right = ((col + 1) * source.width).intdiv(columns)
            int bottom = ((row + 1) * source.height).intdiv(rows)
            def crop = source.getSubimage(left, top, right - left, bottom - top)
            def resized = new java.awt.image.BufferedImage(
                width, height, java.awt.image.BufferedImage.TYPE_INT_RGB)
            def graphics = resized.createGraphics()
            try {
                graphics.setRenderingHint(
                    java.awt.RenderingHints.KEY_INTERPOLATION,
                    java.awt.RenderingHints.VALUE_INTERPOLATION_BILINEAR)
                graphics.drawImage(crop, 0, 0, width, height, null)
            } finally {
                graphics.dispose()
            }
            def bytes = new java.io.ByteArrayOutputStream(8 + width * height * 2)
            // GAI1 / uint16LE width / uint16LE height / RGB565 little-endian.
            bytes.write([71, 65, 73, 49, width, 0, height, 0] as byte[])
            for (int y = 0; y < height; y++) {
                for (int x = 0; x < width; x++) {
                    int rgb = resized.getRGB(x, y)
                    int value = ((rgb >> 19) & 31) << 11 |
                        ((rgb >> 10) & 63) << 5 | ((rgb >> 3) & 31)
                    bytes.write(value & 255)
                    bytes.write((value >> 8) & 255)
                }
            }
            File dest = new File(dir, name + ".rgb565")
            dest.bytes = bytes.toByteArray()
            if (dest.length() != 8 + width * height * 2)
                throw new GradleException("Incomplete Gumball asset: " + name)
        }
        // The source cast studies are concept boards, not sprite sheets.
        // Extract a reviewed expression panel of each actual encounter ally
        // for the sortie HUD; do not substitute generic candy characters.
        [
            pip_parfait: pipSheet.get().asFile,
            lolly_wren: lollySheet.get().asFile
        ].each { name, sheet ->
            def character = javax.imageio.ImageIO.read(sheet)
            if (character == null ||
                character.width != 1536 || character.height != 1024)
                throw new GradleException("Wrong Gumball ally sheet: " + name)
            def portrait = character.getSubimage(1150, 5, 128, 118)
            def resized = new java.awt.image.BufferedImage(
                width, height, java.awt.image.BufferedImage.TYPE_INT_RGB)
            def graphics = resized.createGraphics()
            try {
                graphics.setRenderingHint(
                    java.awt.RenderingHints.KEY_INTERPOLATION,
                    java.awt.RenderingHints.VALUE_INTERPOLATION_BILINEAR)
                graphics.drawImage(portrait, 0, 0, width, height, null)
            } finally {
                graphics.dispose()
            }
            def bytes = new java.io.ByteArrayOutputStream(8 + width * height * 2)
            bytes.write([71, 65, 73, 49, width, 0, height, 0] as byte[])
            for (int y = 0; y < height; y++)
                for (int x = 0; x < width; x++) {
                    int rgb = resized.getRGB(x, y)
                    int value = ((rgb >> 19) & 31) << 11 |
                        ((rgb >> 10) & 63) << 5 | ((rgb >> 3) & 31)
                    bytes.write(value & 255)
                    bytes.write((value >> 8) & 255)
                }
            File allies = new File(outputRoot, "native/gumball/allies")
            if (!allies.mkdirs() && !allies.isDirectory())
                throw new GradleException("Cannot stage Gumball allies")
            File dest = new File(allies, name + ".rgb565")
            dest.bytes = bytes.toByteArray()
            if (dest.length() != 8 + width * height * 2)
                throw new GradleException("Incomplete Gumball ally: " + name)
        }
    }
}

def stageGumballRouteArt = tasks.register(
    "stageGumballRouteArt", StageGumballRouteArtTask
) {
    sourceAtlas.set(rootProject.layout.projectDirectory.file(
        "art/gumball/source/candy_cosmos_asset_atlas.png"))
    pipSheet.set(rootProject.layout.projectDirectory.file(
        "art/gumball/source/pip_parfait_cherry_whiz.png"))
    lollySheet.set(rootProject.layout.projectDirectory.file(
        "art/gumball/source/lolly_wren_soft_landing.png"))
    outputDirectory.set(layout.buildDirectory.dir("generated/gumballRouteAssets"))
}

// Public-distribution guard: the Valve CC BY-NC-SA mesh must not silently
// enter an APK through Android's automatic src/main/assets packaging.
// A separate user-controlled importer may be implemented later.
def restrictedSteamControllerArchive =
    file("src/main/assets/steam_controller_2015/handoff.zip")
if (restrictedSteamControllerArchive.isFile()) {
    throw new GradleException(
        "Restricted Steam Controller CAD-derived archive is in the "
            + "automatically packaged Android assets directory. Move it "
            + "outside app/src/main/assets; the default distribution "
            + "must use the procedurally rendered controller fallback."
    )
}

def doomSharewareArchive = rootProject.file(
    "third_party/doom-shareware/payload/default-content/doom19s.zip"
)
def excludeDoomShareware =
    project.hasProperty("excludeDoomShareware")
def bundleDoomShareware =
    !excludeDoomShareware && doomSharewareArchive.isFile()

// Original Ken Silverman freeware ZIP, excluded from commercial variants.
def kenArchive = rootProject.file(
    "third_party/kens-labyrinth/payload/default-content/labfull.zip"
)
def excludeKensLabyrinth = project.hasProperty("excludeKensLabyrinth")
def bundleKensLabyrinth = !excludeKensLabyrinth && kenArchive.isFile()

// Adept Software's original freeware 1.5 ZIP; one source, two games.
def jetpackArchive = rootProject.file(
    "third_party/jetpack/payload/default-content/jetpak15.zip"
)
def excludeJetpack = project.hasProperty("excludeJetpack")
def bundleJetpack = !excludeJetpack && jetpackArchive.isFile()

def dosboxPureAndroidMk = rootProject.file(
    "third_party/dosbox-pure/src/jni/Android.mk"
)
def dosRuntimeBuilt = dosboxPureAndroidMk.isFile()

def diagnosticIntakeUrl =
    (project.findProperty("diagnosticIntakeUrl") ?: "")
        .toString()
        .replace("\r", "")
        .replace("\n", "")
def diagnosticIntakeUrlEscaped =
    diagnosticIntakeUrl
        .replace("\\", "\\\\")
        .replace("\"", "\\\"")

def phoneTestRunNumber =
    (project.findProperty("phoneTestRunNumber") ?: "0")
        .toString()
        .toInteger()
def phoneTestRunAttempt =
    (project.findProperty("phoneTestRunAttempt") ?: "0")
        .toString()
        .toInteger()
// GitHub workflow run numbers can reset when the release workflow changes.
// Use build time for Android's monotonically increasing install versionCode;
// the run/attempt remain human-readable release identifiers only.
// Seconds since 2020 fit inside Android's signed 32-bit versionCode through 2088.
def phoneTestBuildEpochSeconds =
    (project.findProperty("phoneTestBuildEpochSeconds")
        ?: java.time.Instant.now().epochSecond)
        .toString()
        .toLong()
def phoneTestVersionCode =
    phoneTestRunNumber > 0
        ? (phoneTestBuildEpochSeconds - 1577836800L).intValue()
        : 1
def phoneTestSignerSha256 =
    (project.findProperty("phoneTestSignerSha256") ?: "")
        .toString()
        .replaceAll("[^A-Fa-f0-9]", "")
        .toLowerCase()
def sourceRevision =
    (project.findProperty("sourceRevision") ?: "local")
        .toString()
        .replaceAll("[^A-Za-z0-9._-]", "")
def sourceRevisionEscaped =
    sourceRevision
        .replace("\\", "\\\\")
        .replace("\"", "\\\"")

def phoneTestKeystorePath =
    (project.findProperty("phoneTestKeystorePath") ?: "")
        .toString()
def phoneTestStorePassword =
    (project.findProperty("phoneTestStorePassword") ?: "")
        .toString()
def phoneTestKeyAlias =
    (project.findProperty("phoneTestKeyAlias") ?: "")
        .toString()
def phoneTestKeyPassword =
    (
        project.findProperty("phoneTestKeyPassword")
            ?: phoneTestStorePassword
    )
        .toString()
def phoneTestSigningConfigured =
    !phoneTestKeystorePath.isEmpty()
        && !phoneTestStorePassword.isEmpty()
        && !phoneTestKeyAlias.isEmpty()
        && !phoneTestKeyPassword.isEmpty()
        && file(phoneTestKeystorePath).isFile()
def updateChannelEnabled =
    phoneTestSigningConfigured
        && phoneTestRunNumber > 0
        && phoneTestSignerSha256.length() == 64

// New Google Play upload generation; legacy phone-test keys cannot sign Play releases.
def playUploadKeystorePath = (project.findProperty("playUploadKeystorePath") ?: "").toString()
def playUploadStorePassword = (project.findProperty("playUploadStorePassword") ?: "").toString()
def playUploadKeyAlias = (project.findProperty("playUploadKeyAlias") ?: "").toString()
def playUploadKeyPassword = (project.findProperty("playUploadKeyPassword") ?: "").toString()
def playUploadConfigured =
    !playUploadKeystorePath.isEmpty()
        && !playUploadStorePassword.isEmpty()
        && !playUploadKeyPassword.isEmpty()
        && playUploadKeyAlias == "reverievr-play-upload-v1"
        && file(playUploadKeystorePath).isFile()


/*
 * All eleven owner-authorized songs are staged into every APK variant.
 * Source remains in one Git location; every original and staged MP3 is
 * SHA-256 validated before AAPT packages local files. No network runtime.
 */
def sourceMusicManifest = rootProject.file("music/source/manifest.json")
def sourceMusicMasters = rootProject.file("music/source/audio")
def ownerMusicAssets = layout.buildDirectory.dir("generated/ownerMusicAssets")
def stageOwnerMusicAssets = tasks.register(
    "stageOwnerMusicAssets", StageOwnerMusicTask
) {
    inputs.file(sourceMusicManifest)
    inputs.dir(sourceMusicMasters)
    outputDirectory.set(ownerMusicAssets)
    doLast {
        def manifest = new groovy.json.JsonSlurper().parse(sourceMusicManifest)
        if (manifest.schema != 1 ||
            manifest.binary_status != "source-binaries-checked-in" ||
            !(manifest.tracks instanceof List) || manifest.tracks.size() != 11) {
            throw new GradleException("Unverified source music inventory")
        }
        def digestOf = { File fileToHash ->
            def digester = java.security.MessageDigest.getInstance("SHA-256")
            fileToHash.withInputStream { input ->
                byte[] buf = new byte[65536]
                int read
                while ((read = input.read(buf)) != -1)
                    if (read > 0) digester.update(buf, 0, read)
            }
            return digester.digest().collect {
                String.format("%02x", it & 0xff)
            }.join("")
        }
        File out = outputDirectory.get().asFile
        project.delete(out)
        File targetFolder = new File(out, "music/tracks")
        if (!targetFolder.mkdirs() && !targetFolder.isDirectory())
            throw new GradleException("Cannot create owner music staging")
        def ids = new HashSet<String>()
        def entries = [
            "# Owner-original music: commercially authorized for ReverieVR",
            "# id<TAB>title<TAB>source<TAB>license<TAB>sha256"
        ]
        manifest.tracks.each { track ->
            String title = track.title.toString()
            String id = title.toLowerCase(java.util.Locale.ROOT)
                .replaceAll("[^a-z0-9]+", "-")
                .replaceAll('(^-|-$)', "")
            if (!id.matches("[a-z0-9][a-z0-9_-]{0,79}") ||
                !ids.add(id) ||
                track.license != "LicenseRef-Owner-Original-Music" ||
                track.filename != title + ".mp3")
                throw new GradleException("Invalid source music record: " + title)
            File master = new File(sourceMusicMasters, track.filename.toString())
            if (master.canonicalFile.parentFile != sourceMusicMasters.canonicalFile ||
                !master.isFile() || master.length() != (track.bytes as long) ||
                digestOf(master) != track.sha256)
                throw new GradleException("Source music hash/size mismatch: " + title)
            File staged = new File(targetFolder, id + ".mp3")
            java.nio.file.Files.copy(master.toPath(), staged.toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            if (digestOf(staged) != track.sha256)
                throw new GradleException("Staged music verification failed: " + title)
            entries << [id,title,"music/tracks/" + id + ".mp3",
                        "LicenseRef-Owner-Original-Music",track.sha256].join("\t")
        }
        new File(out,"music/owner_library.tsv").text =
            entries.join("\n") + "\n"
    }
}

// A Play build can compile in CI with ID=0, but production eligibility
// is blocked until the actual Play Console Games services project ID is set.
def playGamesProjectId = (project.findProperty('playGamesProjectId') ?: '0').toString()
if (!(playGamesProjectId ==~ /[0-9]{1,24}/)) {
    throw new GradleException('Invalid playGamesProjectId: use the decimal Games services project ID shown in Play Console')
}

android {
    // Native music player opens packaged Suno tracks as seekable FD slices.
    // Keep approved MP3/WAV assets uncompressed in the APK.
    androidResources {
        noCompress += ["mp3", "wav"]
    }
    namespace = "io.github.mrcalzon02.reverievr"
    compileSdk = 36

    defaultConfig {
        applicationId = "io.github.mrcalzon02.reverievr"
        minSdk = 26
        targetSdk = 36
        versionCode = phoneTestVersionCode
        versionName = "0.1.0-dev"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField(
            "boolean",
            "DOS_RUNTIME_BUILT",
            dosRuntimeBuilt.toString()
        )

        ndk {
            // Emulator tests build ONLY x86-64; normal phone builds
            // remain unchanged with both Galaxy S9 ARM architectures.
            if(project.hasProperty("companionEmulatorAbi")) {
                abiFilters "x86_64"
            } else {
                abiFilters "armeabi-v7a", "arm64-v8a"
            }
        }
        externalNativeBuild {
            ndkBuild {
                arguments(
                    "APP_PLATFORM=android-26",
                    "APP_STL=c++_static"
                )
            }
        }
        buildConfigField(
            "boolean",
            "DOOM_SHAREWARE_BUNDLED",
            bundleDoomShareware.toString()
        )
        buildConfigField(
            "boolean",
            "KENS_LABYRINTH_BUNDLED",
            bundleKensLabyrinth.toString()
        )
        buildConfigField(
            "boolean",
            "JETPACK_BUNDLED",
            bundleJetpack.toString()
        )
        buildConfigField(
            "String",
            "DIAGNOSTIC_INTAKE_URL",
            "\"${diagnosticIntakeUrlEscaped}\""
        )
        buildConfigField(
            "int",
            "PHONE_TEST_RUN_NUMBER",
            phoneTestRunNumber.toString()
        )
        buildConfigField(
            "int",
            "PHONE_TEST_RUN_ATTEMPT",
            phoneTestRunAttempt.toString()
        )
        buildConfigField(
            "long",
            "PHONE_TEST_BUILD_EPOCH_SECONDS",
            (phoneTestRunNumber > 0 ? phoneTestBuildEpochSeconds : 0L).toString() + "L"
        )
        buildConfigField(
            "String",
            "SOURCE_REVISION",
            "\"${sourceRevisionEscaped}\""
        )
        buildConfigField(
            "boolean",
            "UPDATE_CHANNEL_ENABLED",
            updateChannelEnabled.toString()
        )
        buildConfigField("boolean", "PLAY_DISTRIBUTION", "false")
        buildConfigField(
            "String",
            "DISTRIBUTION_SIGNER_SHA256",
            "\"" + phoneTestSignerSha256 + "\""
        )
    }

    signingConfigs {
        if (phoneTestSigningConfigured) {
            phoneTest {
                storeFile = file(phoneTestKeystorePath)
                storePassword = phoneTestStorePassword
                keyAlias = phoneTestKeyAlias
                keyPassword = phoneTestKeyPassword
            }
        }
        if (playUploadConfigured) {
            playUpload {
                storeFile = file(playUploadKeystorePath)
                storePassword = playUploadStorePassword
                keyAlias = playUploadKeyAlias
                keyPassword = playUploadKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            debuggable = true
        }

        phoneTest {
            debuggable = false
            minifyEnabled = false
            shrinkResources = false
            matchingFallbacks = ["release", "debug"]

            if (phoneTestSigningConfigured) {
                signingConfig = signingConfigs.phoneTest
            }
        }

        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles(
                getDefaultProguardFile("proguard-android-optimize.txt"),
                "proguard-rules.pro"
            )
        }

        // New Play AAB distribution only. No legacy GitHub APK update channel.
        play {
            resValue 'string', 'game_services_project_id', playGamesProjectId
            initWith release
            debuggable = false
            signingConfig = null
            matchingFallbacks = ["release", "debug"]
            buildConfigField("boolean", "UPDATE_CHANNEL_ENABLED", "false")
            buildConfigField("boolean", "PLAY_DISTRIBUTION", "true")
            if (playUploadConfigured) {
                signingConfig = signingConfigs.playUpload
            }
        }
    }

    sourceSets {
        main {
            if (bundleDoomShareware) {
                assets.srcDir(
                    rootProject.file(
                        "third_party/doom-shareware/payload"
                    )
                )
            }
            if (bundleKensLabyrinth) {
                assets.srcDir(
                    rootProject.file(
                        "third_party/kens-labyrinth/payload"
                    )
                )
            }
            if (bundleJetpack) {
                assets.srcDir(rootProject.file(
                    "third_party/jetpack/payload"
                ))
            }
        }
    }

    externalNativeBuild {
        ndkBuild {
            path = file("src/main/jni/Android.mk")
        }
    }

    buildFeatures {
        buildConfig = true
        resValues = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

// AGP's legacy android.sourceSets API does not support providers. Register
// generated owner music on each variant through the supported Sources API,
// keeping music verification and staging as a single shared task.
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.assets?.addGeneratedSourceDirectory(
            stageOwnerMusicAssets, { task -> task.outputDirectory }
        )
        variant.sources.assets?.addGeneratedSourceDirectory(
            stageGumballRouteArt, { task -> task.outputDirectory }
        )
    }
}

dependencies {
    implementation project(":cardboard")
    playImplementation 'com.google.android.gms:play-services-games-v2:22.1.0'

    implementation "com.google.protobuf:protobuf-javalite:3.19.4"
    // Optional read-only Windows SMB2/SMB3 import (Apache-2.0). No PC helper.
    implementation "com.hierynomus:smbj:0.15.0"
    // MBassador (SMBJ transitively) references the Java Expression Language API.
    // Supply the real API for R8 rather than ignoring a missing runtime class.
    implementation "javax.el:javax.el-api:3.0.1-b06"
    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test:runner:1.6.2"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
}


tasks.configureEach { task ->
    if (task.name == "preReleaseBuild") {
        task.doFirst {
            if (!excludeDoomShareware
                && !doomSharewareArchive.isFile()) {
                throw new GradleException(
                    "Release builds include DOOM Shareware v1.9 by default. "
                        + "Run scripts/fetch-doom-shareware.sh "
                        + "(or .bat), or pass "
                        + "-PexcludeDoomShareware for a build that "
                        + "intentionally omits the shareware content."
                )
            }
            if (!excludeKensLabyrinth && !kenArchive.isFile()) {
                throw new GradleException(
                    "Release builds include Ken's Labyrinth by default. "
                    + "Run scripts/fetch-kens-labyrinth.sh (or .bat), "
                    + "or pass -PexcludeKensLabyrinth for a no-Ken build."
                )
            }
            if (!excludeJetpack && !jetpackArchive.isFile()) {
                throw new GradleException(
                    "Release builds include Jetpack and Squarez by default. "
                    + "Run scripts/fetch-jetpack.sh or pass "
                    + "-PexcludeJetpack to omit both games."
                )
            }
        }
    }
}

tasks.register("validatePlayUploadSigning") {
    doLast {
        if (!playUploadConfigured) {
            throw new GradleException("Play bundle blocked: supply NEW reverievr-play-upload-v1 upload key properties")
        }
        if (playUploadKeystorePath &&
            phoneTestKeystorePath &&
            file(playUploadKeystorePath).canonicalPath == file(phoneTestKeystorePath).canonicalPath) {
            throw new GradleException("Play bundle blocked: must not reuse legacy ReverieVR phone-test key")
        }
    }
}
tasks.configureEach { task ->
    if (task.name in ["bundlePlay", "assemblePlay"]) task.dependsOn("validatePlayUploadSigning")
}
