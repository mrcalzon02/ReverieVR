plugins { id "com.android.application" }

// This is the full existing Breakwater C++ game in a separate Android app,
// not a dormant slot in the hub. Source remains in the authoritative game tree.
def keyPath=(project.findProperty("phoneTestKeystorePath") ?: "").toString()
def storePass=(project.findProperty("phoneTestStorePassword") ?: "").toString()
def publisherAlias=(project.findProperty("phoneTestKeyAlias") ?: "").toString()
def keyPass=(project.findProperty("phoneTestKeyPassword") ?: storePass).toString()
def signerReady=!keyPath.isEmpty() && !storePass.isEmpty() &&
    !publisherAlias.isEmpty() && !keyPass.isEmpty() && file(keyPath).isFile()

android {
    namespace="io.github.mrcalzon02.reverievr.game.breakwater"
    compileSdk=36
    defaultConfig {
        applicationId="io.github.mrcalzon02.reverievr.game.breakwater"
        minSdk=26
        targetSdk=36
        versionCode=(project.findProperty("breakwaterVersionCode") ?: "1")
            .toString().toInteger()
        versionName=(project.findProperty("breakwaterVersionName") ?: "0.1.0")
            .toString()
        ndk {
            if(project.hasProperty("companionEmulatorAbi"))
                abiFilters "x86_64"
            else abiFilters "armeabi-v7a","arm64-v8a"
        }
        externalNativeBuild {
            ndkBuild { arguments("APP_PLATFORM=android-26","APP_STL=c++_static") }
        }
    }
    signingConfigs {
        if(signerReady){
            publisher {
                storeFile=file(keyPath)
                storePassword=storePass
                keyAlias=publisherAlias
                keyPassword=keyPass
            }
        }
    }
    buildTypes {
        debug {
            debuggable=true
            if(signerReady)signingConfig=signingConfigs.publisher
        }
        release {
            minifyEnabled=false
            if(signerReady)signingConfig=signingConfigs.publisher
        }
    }
    // Stage only reviewed shared materials, horizons and models plus the two
    // owner-specific vehicles for the legacy companion test package.
    sourceSets {
        main { assets.srcDirs += ["$buildDir/generated/breakwater-assets"] }
    }
    externalNativeBuild {
        ndkBuild { path=file("src/main/jni/Android.mk") }
    }
    compileOptions {
        sourceCompatibility=JavaVersion.VERSION_17
        targetCompatibility=JavaVersion.VERSION_17
    }
}
dependencies {
    implementation project(":cardboard")
    implementation "com.google.protobuf:protobuf-javalite:3.19.4"
}
tasks.register("stageBreakwaterAssets",Sync){
    // Clears obsolete duplicated files in incremental companion builds.
    into("$buildDir/generated/breakwater-assets")
    from(rootProject.file("app/src/main/assets/native/shared/v1")){
        into("native/shared/v1")
        include "materials/coastal/shingle.png"
        include "materials/coastal/quay_concrete.png"
        include "materials/coastal/black_basalt.png"
        include "materials/coastal/oxidized_steel.png"
        include "materials/coastal/sandbag_burlap.png"
        include "materials/coastal/olive_enamel.png"
        include "materials/coastal/dock_planks.png"
        include "materials/coastal/mossy_seawall.png"
        include "materials/coastal/corrugated_roof.png"
        include "materials/coastal/camo_netting.png"
        include "materials/coastal/diamond_plate.png"
        include "materials/coastal/trench_soil.png"
        include "materials/coastal/reinforced_concrete.png"
        include "materials/coastal/crate_planks.png"
        include "materials/coastal/riveted_bulkhead.png"
        include "materials/coastal/pebble_ground.png"
        include "horizons/shingle_bay_skybox_1024x512.png"
        include "horizons/iron_quay_skybox_1024x512.png"
        include "horizons/blackcap_island_skybox_1024x512.png"
        include "horizons/stormwatch_point_skybox_1024x512.png"
        include "models/psx/concrete_block_1.bwm"
        include "models/psx/wooden_crate_1.bwm"
        include "models/psx/ammo_box_mp_1.bwm"
    }
    from(rootProject.file("app/src/main/assets/native/breakwater/beckenburg")){
        into("native/breakwater/beckenburg")
        include "owner_boat_rowboat.bwm"
        include "owner_apc_armor.bwm"
    }
}
tasks.matching {it.name=="preBuild"}.configureEach{
    dependsOn("stageBreakwaterAssets")
}
tasks.register("requireBreakwaterPublisherSigner"){
    doLast {
        if(!signerReady)throw new GradleException(
            "Standalone Breakwater release requires the hub's signing identity")
    }
}
tasks.matching {it.name=="assembleRelease"}.configureEach{
    dependsOn("requireBreakwaterPublisherSigner")
}
